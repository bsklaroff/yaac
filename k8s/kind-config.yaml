# kind cluster config for yaac.
#
# Two pieces of wiring yaac needs and cannot add to a running cluster:
#   1. containerd `config_path`, so the node reads per-registry `hosts.toml`
#      files out of /etc/containerd/certs.d. Both yaac registries — the main
#      one and the per-project ones — are in-cluster Services, which the node
#      cannot resolve by cluster DNS; one-shot pods hostPath-mount that
#      directory and write each registry's live ClusterIP into it.
#   2. extraMounts making your home directory visible to the node at the
#      same path — yaac session pods mount worktrees, caches, and
#      credentials via hostPath, which resolves on the NODE, not the host.
#
# Substitute $HOME for your real home directory before use (kind does not
# expand environment variables), e.g.:
#   sed "s|\$HOME|$HOME|g" k8s/kind-config.yaml | kind create cluster --name yaac --config -
#
# MULTI-NODE: `yaac cluster install --nodes N` renders this file into an
# N-node cluster by COPYING the control-plane entry below into N-1 `role:
# worker` entries — so the $HOME extraMount lands on every node, which is
# what keeps hostPath working when a session schedules off the control
# plane (all kind node containers share the one host filesystem). The
# `nodes:` list must therefore stay LAST in this file, and hold exactly one
# entry. Everything above it is cluster-scoped and kind applies it to every
# node already: the containerd registry patch, the kubelet swap patch, and
# disableDefaultCNI.
#
# Anything added to the node entry is therefore copied to every worker too,
# so it must be a per-node property. A HOST-scoped one — extraPortMappings
# above all — would have N nodes claiming one host port; put such settings
# in the cluster-scoped section, or teach the renderer to strip them.
#
# kind keeps the control-plane's `node-role.kubernetes.io/control-plane`
# NoSchedule taint once a cluster has workers (it only clears it on
# worker-less ones), and yaac does not untaint it. So sessions land on the
# WORKERS only: `--nodes 2` gives one session-eligible node, `--nodes 3`
# gives two — which is the smallest topology that actually exercises
# multi-node scheduling.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  # No kindnet: its NetworkPolicy engine (kube-network-policies) fails
  # OPEN — a new pod's first packets flow before its IP reaches the
  # engine's nftables set, so sessions would start with a brief window of
  # unrestricted egress. `yaac cluster install` installs Calico instead,
  # which fails CLOSED: until Felix has programmed a workload's endpoint,
  # traffic on its veth hits the dispatch chain's "unknown interface"
  # DROP. Calico allocates pod IPs from the cluster CIDR (kind's default
  # podSubnet — nothing in yaac depends on its value).
  disableDefaultCNI: true
containerdConfigPatches:
- |-
  [plugins."io.containerd.grpc.v1.cri".registry]
    config_path = "/etc/containerd/certs.d"
kubeadmConfigPatches:
# Let pods use the host's swap. kind's default kubelet config only
# *tolerates* swap on the node (failSwapOn: false); without a swapBehavior
# the default is NoSwap, which pins every pod's memory. LimitedSwap (the
# only supported behavior since NodeSwap went GA) grants swap to Burstable
# pods proportionally to their memory request — yaac session pods request
# less memory than their limit, so they qualify.
- |
  kind: KubeletConfiguration
  apiVersion: kubelet.config.k8s.io/v1beta1
  memorySwap:
    swapBehavior: LimitedSwap
nodes:
- role: control-plane
  extraMounts:
  - hostPath: $HOME
    containerPath: $HOME
