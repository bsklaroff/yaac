# Static Helm values for the vendored vcluster chart
# (vcluster-<VERSION>.tgz). Applied at session-create time by
# packages/server/src/lib/k8s/vcluster.ts via `helm template`; the per-session values
# (registry, API host) are passed as `--set` overrides, so this file
# carries no placeholders. The only post-render step is stamping the
# yaac ownership labels onto every object (no global-labels knob in the
# chart) — see addYaacLabels in vcluster.ts.
#
# `--set` overrides supplied at render time (renderVclusterManifests),
# where <api-host> is the API Service's in-cluster DNS FQDN
# (<name>.<vc-namespace>.svc.cluster.local — resolved through the proxy's
# split-horizon DNS to the live, allocator-assigned ClusterIP):
#   controlPlane.advanced.defaultImageRegistry  -> registryHost()
#   controlPlane.proxy.extraSANs[0]             -> <api-host>
#   exportKubeConfig.server                     -> https://<api-host>:8443
controlPlane:
  distro:
    k8s:
      # k8s distro with the embedded SQLite backing store (vcluster's
      # default pairing) — no etcd pod, no PVC.
      enabled: true
  backingStore:
    database:
      embedded:
        enabled: true
  statefulSet:
    image:
      # OSS syncer, not the default vcluster-pro.
      repository: loft-sh/vcluster-oss
    # No runtimeClassName: the control-plane pod (apiserver/kine/SQLite)
    # is trusted yaac infra and runs on runc. It only runs vendored
    # vcluster code, so the sentry buys no containment — and an
    # apiserver+datastore is exactly the syscall-heavy workload whose
    # sentry starves the node (see gvisor.ts). What tenants schedule
    # stays sandboxed via sync.toHost.pods.runtimeClassName below.
    persistence:
      volumeClaim:
        # emptyDir datastore: per-session vclusters are disposable.
        enabled: false
  advanced:
    # defaultImageRegistry is supplied via --set (registryHost(), runtime
    # value). It rewrites every image registry (ghcr.io, mirror.gcr.io,
    # ...) to the local registry, so neither the node nor the vcluster
    # ever pulls upstream — ensureVclusterImages mirrors the pinned set
    # (k8s/vcluster/images.json) ahead of time.
    konnectivity:
      # Konnectivity serves the private-nodes mode; classic synced-pod
      # vclusters proxy kubelets through the syncer. Disabling it keeps
      # an unmirrored agent image from ever being scheduled.
      server:
        enabled: false
      agent:
        enabled: false
  coredns:
    deployment:
      # Pinned so images.json stays the closed set of images a vcluster
      # can schedule (the default is derived from the k8s minor at
      # runtime, which would drift under upgrades).
      image: coredns/coredns:1.12.1
  service:
    # The chart renders spec via `toYaml` passthrough and skips its
    # default ports when spec.ports is set, so the whole Service shape
    # comes from here (the ClusterIP stays allocator-assigned):
    #   - yaac-api 8443: the session pod dials this; the in-pod nat layer
    #     captures all 443/80, so the API the SESSION uses must be off 443.
    #   - https 443 -> 8443: synced pods reach the inner apiserver through
    #     the virtual kubernetes.default Service, which vcluster maps onto
    #     the host Service at 443; synced pods carry no nat layer.
    #   - kubelet 10250 -> 8443: the syncer's kubelet proxy.
    # spec.selector is intentionally omitted so the chart fills the
    # default {app: vcluster, release: <name>} selector.
    spec:
      type: ClusterIP
      ports:
        - name: yaac-api
          port: 8443
          targetPort: 8443
          protocol: TCP
        - name: https
          port: 443
          targetPort: 8443
          protocol: TCP
        - name: kubelet
          port: 10250
          targetPort: 8443
          protocol: TCP
  proxy:
    # extraSANs[0] (the API's service-DNS FQDN) is supplied via --set: the
    # exported kubeconfig dials https://<api-host>:8443, and the session
    # pod resolves that name through the proxy's split-horizon DNS (which
    # forwards only `.cluster.local` to CoreDNS) to the live ClusterIP.
    extraSANs: []
sync:
  toHost:
    # NOTE: two DIFFERENT label mechanisms, easy to conflate.
    #   - STAMP (inject a label the virtual pod lacks): a vcluster PRO
    #     feature ("Translate Patches", sync.toHost.pods.patches) — the OSS
    #     syncer hard-errors on it. So the OUTER yaac cannot add
    #     yaac.session-id to an arbitrary tenant pod.
    #   - PROPAGATE (copy a label the virtual pod already carries): default
    #     behavior — the host pod gets the virtual pod's labels verbatim. So
    #     an INNER yaac's own pods (which it labels app=yaac-proxy /
    #     yaac.role / yaac.session-id at creation) DO carry those labels on
    #     the host. A pure tenant workload that sets none carries none.
    # Containment therefore keys on vcluster.loft.sh/managed-by — the ONE
    # label the SYNCER itself stamps on every synced pod, which a tenant
    # cannot forge or suppress. The per-vcluster fallback-redirect CNP
    # (buildVclusterFallbackRedirectCnpManifest), selecting managed-by, is
    # the default-deny egress floor (world → outer proxy + intracluster),
    # replacing yaac-session-egress for these pods. Any yaac labels that DO
    # propagate are forgeable, so policy never relies on them for the
    # containment boundary — only for non-escalating routing (inner-vs-outer
    # proxy). Beware: this all rests on vcluster's default verbatim label
    # propagation — a chart bump that starts translating pod labels would
    # break the redirect selectors (see the nesting e2e).
    pods:
      enabled: true
      # Every synced pod carries the `gvisor` RuntimeClass (registered by
      # `yaac cluster setup`), so everything a vcluster schedules runs on the
      # sentry. The default tier (not gvisor-nested) — synced pods are
      # ordinary tenant/CoreDNS workloads; an inner yaac's own nested SESSION
      # pods still build their engine fine on this handler (only
      # in-nested-container raw sockets, e.g. ping, want the -nested handler,
      # which a single syncer stamp can't target per-pod). The VAP pod guard
      # requires this tier as the containment for any pod adding capabilities
      # (see buildVclusterPodGuardPolicyManifest). Explicit so the
      # every-untrusted-pod-is-sandboxed invariant (cluster check's
      # runtime-stamp sweep) holds for everything a vcluster schedules.
      runtimeClassName: gvisor
    networkPolicies:
      # DELIBERATELY OFF (security). Syncing tenant NetworkPolicies to the
      # host lets anything inside the vcluster create an allow-all egress
      # NetworkPolicy that unions over our (allow-only) synced-pod
      # containment and grants its synced pod raw internet egress —
      # bypassing the proxy/allowlist entirely (verified). Synced-pod
      # containment instead comes solely from the yaac-applied fallback
      # redirect CNP (managed-by → default-deny + redirect to the outer
      # proxy), which a tenant cannot widen. Cost: an inner yaac's own
      # NetworkPolicies are not enforced on the host — acceptable (inner
      # sessions are confined by the outer fallback regardless).
      enabled: false
  fromHost:
    nodes:
      enabled: true
      selector:
        # Sync the (single) node unconditionally — the default syncs
        # only nodes already running one of the vcluster's pods, which
        # makes `kubectl get nodes` empty until the first workload.
        all: true
telemetry:
  enabled: false
