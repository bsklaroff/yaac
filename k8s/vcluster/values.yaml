# Static Helm values for the vendored vcluster chart
# (vcluster-<VERSION>.tgz). Applied at session-create time by
# src/lib/k8s/vcluster.ts via `helm template`; the per-session values
# (registry, pinned VIP) are passed as `--set` overrides, so this file
# carries no placeholders. The only post-render step is stamping the
# yaac ownership labels onto every object (no global-labels knob in the
# chart) — see addYaacLabels in vcluster.ts.
#
# `--set` overrides supplied at render time:
#   controlPlane.advanced.defaultImageRegistry  -> registryHost()
#   controlPlane.service.spec.clusterIP         -> the pinned Service VIP
#   controlPlane.proxy.extraSANs[0]             -> the pinned Service VIP
#   exportKubeConfig.server                     -> https://<VIP>:8443
controlPlane:
  distro:
    k8s:
      # k8s distro with the embedded SQLite backing store (vcluster's
      # default pairing) — no etcd pod, no PVC.
      enabled: true
  backingStore:
    database:
      embedded:
        enabled: true
  statefulSet:
    image:
      # OSS syncer, not the default vcluster-pro.
      repository: loft-sh/vcluster-oss
    persistence:
      volumeClaim:
        # emptyDir datastore: per-session vclusters are disposable.
        enabled: false
  advanced:
    # defaultImageRegistry is supplied via --set (registryHost(), runtime
    # value). It rewrites every image registry (ghcr.io, mirror.gcr.io,
    # ...) to the local registry, so neither the node nor the vcluster
    # ever pulls upstream — ensureVclusterImages mirrors the pinned set
    # (k8s/vcluster/images.json) ahead of time.
    konnectivity:
      # Konnectivity serves the private-nodes mode; classic synced-pod
      # vclusters proxy kubelets through the syncer. Disabling it keeps
      # an unmirrored agent image from ever being scheduled.
      server:
        enabled: false
      agent:
        enabled: false
  coredns:
    deployment:
      # Pinned so images.json stays the closed set of images a vcluster
      # can schedule (the default is derived from the k8s minor at
      # runtime, which would drift under upgrades).
      image: coredns/coredns:1.12.1
  service:
    # The chart renders spec via `toYaml` passthrough and skips its
    # default ports when spec.ports is set, so the whole Service shape
    # comes from here (clusterIP via --set):
    #   - yaac-api 8443: the session pod dials this; the in-pod nat layer
    #     captures all 443/80, so the API the SESSION uses must be off 443.
    #   - https 443 -> 8443: synced pods reach the inner apiserver through
    #     the virtual kubernetes.default Service, which vcluster maps onto
    #     the host Service at 443; synced pods carry no nat layer.
    #   - kubelet 10250 -> 8443: the syncer's kubelet proxy.
    # spec.selector is intentionally omitted so the chart fills the
    # default {app: vcluster, release: <name>} selector.
    spec:
      type: ClusterIP
      ports:
        - name: yaac-api
          port: 8443
          targetPort: 8443
          protocol: TCP
        - name: https
          port: 443
          targetPort: 8443
          protocol: TCP
        - name: kubelet
          port: 10250
          targetPort: 8443
          protocol: TCP
  proxy:
    # extraSANs[0] (the pinned VIP) is supplied via --set: the exported
    # kubeconfig dials https://<VIP>:8443 directly — no DNS dependency at
    # all (session pods stub DNS; kube-dns is unreachable by design).
    extraSANs: []
sync:
  toHost:
    # NOTE (plan deviation, risk #2 fallback): the original design
    # stamped synced pods with yaac.session-id via
    # sync.toHost.pods.patches, but expression patches are a vcluster
    # PRO feature ("Translate Patches") — the OSS syncer hard-errors on
    # them. Synced-pod confinement instead keys on the
    # vcluster.loft.sh/managed-by label the syncer always stamps: the
    # per-vcluster synced-pods NetworkPolicy
    # (buildVclusterSyncedPodsNetworkPolicyManifest) is their
    # default-deny backstop, replacing yaac-session-egress for these
    # pods. Synced pods carry NO yaac labels at all, which also keeps
    # them invisible to the session reaper/list paths.
    pods:
      enabled: true
    networkPolicies:
      # DELIBERATELY OFF (security). Syncing tenant NetworkPolicies to the
      # host lets anything inside the vcluster create an allow-all egress
      # NetworkPolicy that unions over our (allow-only) synced-pods
      # containment and grants its synced pod raw internet egress —
      # bypassing the proxy/allowlist entirely (verified). Synced-pod
      # containment instead comes solely from the yaac-applied policies
      # (the per-vcluster synced-pods NetworkPolicy + the blanket
      # yaac-egress-world-deny CiliumNetworkPolicy), which a tenant cannot
      # widen. Cost: an inner yaac's own NetworkPolicies are not enforced
      # on the host — acceptable in v1 (inner sessions are confined by the
      # outer policies and have no upstream egress regardless).
      enabled: false
  fromHost:
    nodes:
      enabled: true
      selector:
        # Sync the (single) node unconditionally — the default syncs
        # only nodes already running one of the vcluster's pods, which
        # makes `kubectl get nodes` empty until the first workload.
        all: true
telemetry:
  enabled: false
