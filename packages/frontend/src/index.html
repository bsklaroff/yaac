<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- viewport-fit=cover so env(safe-area-inset-*) reports real values and
         the mobile shell can keep its chrome clear of the notch and the home
         indicator; the page itself never scrolls (see index.css).
         interactive-widget=resizes-content makes a soft keyboard shrink the
         LAYOUT viewport, not just the visual one: otherwise the layout viewport
         stays full height behind the keyboard, and the browser is free to pan
         the whole shell around inside it while a chat message is being typed.
         (Where it is unsupported, useVisualViewportHeight still fits the app to
         the space that is actually visible.) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>yaac</title>
    <!-- Set the theme before first paint so a forced light/dark choice never
         flashes the other palette. Mirrors loadThemePref() in lib/theme.ts;
         'system' (the default) then follows the prefers-color-scheme media
         query in index.css. -->
    <script>
      try {
        var t = localStorage.getItem('yaac.theme.v1')
        document.documentElement.dataset.theme = t === 'light' || t === 'dark' ? t : 'system'
      } catch (e) {
        document.documentElement.dataset.theme = 'system'
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
