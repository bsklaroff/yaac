appId: com.bsklaroff.yaac
productName: yaac
directories:
  output: dist-app
npmRebuild: false
# tsup bundles the main process and the auth daemon into dist/. The only
# runtime dependency left is node-pty, whose N-API binary loads under
# Electron's Node without a rebuild.
files:
  - dist/**
  - package.json
# Native modules and node-pty's spawn-helper must be real files on disk.
asarUnpack:
  - node_modules/@lydell/**
mac:
  target:
    - dir
  icon: build/icon.png
  # Unsigned for a local build. `pnpm desktop:release` (scripts/release-app.ts)
  # overrides this to sign and notarize the app, inside the .dmg the cask
  # downloads.
  identity: null
  category: public.app-category.developer-tools
# Brew upgrades the app, which has no updater, so there is no update feed to
# publish, and the release .dmg is uploaded by hand (homebrew/README.md).
# Without this, a GH_TOKEN in the environment makes electron-builder assume a
# GitHub feed and write update metadata for it.
publish: null
