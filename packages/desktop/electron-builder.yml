appId: com.bsklaroff.yaac
productName: yaac
directories:
  output: dist-app
# The Electron main (dist/main.js) bundles its own deps (ws), so it needs no
# node_modules. The server + its production node_modules + a standalone Node
# ship UNPACKED as extraResources (a standalone Node can't read app.asar),
# staged by scripts/stage-server.ts.
asar: false
npmRebuild: false
files:
  - dist/**
  - package.json
# The server (dist/ + its production node_modules, incl. node-pty's native
# binary) and the standalone Node are copied into the app by the afterPack hook
# — electron-builder's extraResources strips node_modules, so a plain fs copy
# is the reliable path.
afterPack: ./scripts/after-pack.cjs
# Only the .dmg (release builds) gets an artifact; the version in its name
# comes from -c.extraMetadata.version (the root package version) — this
# package.json deliberately stays 0.0.0.
artifactName: ${productName}-${version}-${arch}.${ext}
mac:
  target:
    - dir
  # Unsigned local build by default (identity: null skips signing), so
  # `pnpm desktop:package` needs no credentials. `pnpm release`
  # (scripts/release.ts) overrides on the CLI: --mac dmg, -c.mac.identity
  # (Developer ID), -c.mac.notarize=true (notarytool env vars). The
  # hardened runtime + entitlements below only take effect when signing.
  identity: null
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  icon: build/icon.png
  category: public.app-category.developer-tools
