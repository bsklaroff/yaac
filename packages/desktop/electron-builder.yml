appId: com.bsklaroff.yaac
productName: yaac
directories:
  output: dist-app
npmRebuild: false
# tsup bundles the main process and the auth daemon into dist/. The only
# runtime dependency left is node-pty, whose N-API binary loads under
# Electron's Node without a rebuild.
files:
  - dist/**
  - package.json
# Native modules and node-pty's spawn-helper must be real files on disk.
asarUnpack:
  - node_modules/@lydell/**
mac:
  target:
    - dir
  icon: build/icon.png
  # Unsigned for a local double-clickable build; signing + notarization + .dmg
  # are a fast-follow.
  identity: null
  category: public.app-category.developer-tools
