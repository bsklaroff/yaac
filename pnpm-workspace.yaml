packages:
  - "packages/*"
  - "k8s/proxy"
  - "k8s/netd"
# Single source of truth for deps pinned in more than one manifest; refer to
# them as "catalog:". k8s/proxy and k8s/netd are the exceptions — their
# package.json files are npm-installed inside their image builds, and npm
# can't resolve catalog: specifiers, so their pins stay inline.
catalog:
  "@agentclientprotocol/claude-agent-acp": 0.81.2
  "@anthropic-ai/claude-agent-sdk": 0.3.280
  "@electric-sql/pglite": 0.5.4
  "@hono/node-server": 1.19.14
  "@hono/node-ws": 1.3.1
  "@hono/zod-validator": 0.7.6
  "@kubernetes/client-node": 1.4.0
  "@lydell/node-pty": 1.1.0
  better-auth: 1.7.2
  "@types/node": 25.5.2
  "@types/ws": 8.18.1
  commander: 14.0.3
  drizzle-orm: 1.0.0-rc.4
  hono: 4.12.14
  smol-toml: 1.6.1
  tsup: 8.5.1
  tsx: 4.21.0
  ws: 8.21.0
  yaml: 2.9.0
  zod: 4.3.6
allowBuilds:
  cpu-features: false
  electron: false
  # electron-builder transitive; only builds Windows installers — never used.
  electron-winstaller: false
  esbuild: false
  protobufjs: false
  ssh2: false
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Adopted at days old (only release; the attention chime's one cue) after
  # reading its full source — see packages/frontend/src/lib/sound.ts.
  - cuelume
  # Adopted at days old because they must match the claude CLI the worktree
  # image pins (dockerfiles/Dockerfile.tools, `AGENT_CLIS`): the server replays
  # stopped transcripts through the same adapter version the image runs live.
  # Mode ids re-verified against this release (runtime/agents/acp-adapters.ts).
  # The rest are what that adapter release pins exactly. Each is exempt at this
  # version only, so a later release still waits out the age gate.
  - "@agentclientprotocol/claude-agent-acp@0.81.2"
  - "@agentclientprotocol/sdk@1.5.0"
  - "@anthropic-ai/claude-agent-sdk@0.3.280"
  - "@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.280"
  - "@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.280"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.280"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.280"
  - "@anthropic-ai/claude-agent-sdk-linux-x64@0.3.280"
  - "@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.280"
  - "@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.280"
  - "@anthropic-ai/claude-agent-sdk-win32-x64@0.3.280"
