packages:
  - "packages/*"
  - "k8s/proxy"
# Single source of truth for deps pinned in more than one manifest; refer to
# them as "catalog:". k8s/proxy is the one exception — its package.json is
# npm-installed inside the proxy image build, and npm can't resolve catalog:
# specifiers, so its pins stay inline.
catalog:
  "@electric-sql/pglite": 0.5.4
  "@hono/node-server": 1.19.14
  "@hono/node-ws": 1.3.1
  "@hono/zod-validator": 0.7.6
  "@kubernetes/client-node": 1.4.0
  "@lydell/node-pty": 1.1.0
  "@types/node": 25.5.2
  "@types/ws": 8.18.1
  commander: 14.0.3
  croner: 10.0.1
  drizzle-orm: 1.0.0-rc.4
  hono: 4.12.14
  simple-git: 3.35.2
  smol-toml: 1.6.1
  tsup: 8.5.1
  tsx: 4.21.0
  ws: 8.21.0
  yaml: 2.9.0
  zod: 4.3.6
allowBuilds:
  cpu-features: false
  electron: false
  # electron-builder transitive; only builds Windows installers — never used.
  electron-winstaller: false
  esbuild: false
  protobufjs: false
  ssh2: false
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Adopted at days old (only release; the attention chime's one cue) after
  # reading its full source — see packages/frontend/src/lib/sound.ts.
  - cuelume
